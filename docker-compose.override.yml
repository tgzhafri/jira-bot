# Development overrides — mounts source code for live reload
# This file is automatically picked up by `docker compose up`
# Remove or rename to disable live-reload in production.
services:
  web:
    volumes:
      - ./reports:/app/reports
      - ./.cache:/app/.cache
      - ./app.py:/app/app.py
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit:ro
